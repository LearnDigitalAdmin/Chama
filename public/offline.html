<!doctype html>
<html lang="en-KE">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0E5C4A" />
<title>You're offline — MyChama</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;background:#0E5C4A;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
  main{max-width:24rem}
  img{width:72px;height:72px;border-radius:16px}
  h1{font-size:1.5rem;margin:1.25rem 0 .5rem}
  p{margin:0 0 1rem;line-height:1.55;color:rgba(255,255,255,.82)}
  button{font:inherit;font-weight:600;border:0;border-radius:999px;padding:.8rem 1.75rem;background:#F5C983;color:#12211c;cursor:pointer}
  small{display:block;margin-top:1.5rem;color:rgba(255,255,255,.6)}
</style>
</head>
<body>
<main>
  <img src="/icon.svg" alt="" width="72" height="72" />
  <h1>You're offline</h1>
  <p>MyChama couldn't reach the network and this page isn't saved on your device yet. Anything you already recorded is safe and will sync when you're back online.</p>
  <button onclick="location.reload()">Try again</button>
  <small>We'll reload automatically when your connection returns.</small>
</main>
<script>addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
